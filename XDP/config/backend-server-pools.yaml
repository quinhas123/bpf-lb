# pool names must match enum l7_proto in xdp.c (http, https, dns, ssh)
# each server takes an optional `weight` (default 1): its relative share of
# round-robin picks

pools:
  http:
    servers:
      - ip: 127.0.0.2
        mac: 00:00:00:00:00:00
      - ip: 127.0.0.3
        mac: 00:00:00:00:00:00

  https:
    servers:
      - ip: 127.0.0.2
        mac: 00:00:00:00:00:00
      - ip: 127.0.0.3
        mac: 00:00:00:00:00:00

  dns:
    servers: []
